services:
  jur-postgres:
    image: pgvector/pgvector:pg16
    container_name: agent-jurist-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jur_db}
      POSTGRES_USER: ${POSTGRES_USER:-jur_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jur_password}
    volumes:
      - jur_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jur_user} -d ${POSTGRES_DB:-jur_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      jur_internal:
      n8n-docker_default:
        aliases:
          - agent-jurist-postgres

  agent-jurist-api:
    build:
      context: .
    container_name: agent-jurist-api
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-jur_user}:${POSTGRES_PASSWORD:-jur_password}@jur-postgres:5432/${POSTGRES_DB:-jur_db}
      UPLOAD_DIR: /app/uploads
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://100.100.209.24:11434}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-120}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      JUR_OLLAMA_BASE_URL: ${JUR_OLLAMA_BASE_URL:-http://100.100.209.24:11434}
      JUR_OLLAMA_MODEL: ${JUR_OLLAMA_MODEL:-qwen3:8b}
      JUR_OLLAMA_TIMEOUT_SECONDS: ${JUR_OLLAMA_TIMEOUT_SECONDS:-900}
      JUR_OLLAMA_THINK: ${JUR_OLLAMA_THINK:-false}
      JUR_OLLAMA_NUM_CTX: ${JUR_OLLAMA_NUM_CTX:-16384}
      JUR_OLLAMA_NUM_PREDICT: ${JUR_OLLAMA_NUM_PREDICT:-3072}
      CORS_ORIGINS: ${CORS_ORIGINS:-[]}
    ports:
      - "127.0.0.1:8020:8000"
    volumes:
      - jur_uploads:/app/uploads
    depends_on:
      jur-postgres:
        condition: service_healthy
    networks:
      jur_internal:
      n8n-docker_default:
        aliases:
          - agent-jurist-api

volumes:
  jur_postgres_data:
  jur_uploads:

networks:
  jur_internal:
  n8n-docker_default:
    external: true
