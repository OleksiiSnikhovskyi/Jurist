services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: jurist
      POSTGRES_USER: jurist
      POSTGRES_PASSWORD: jurist
    ports:
      - "5432:5432"
    volumes:
      - jurist_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jurist -d jurist"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  jurist_postgres_data:

