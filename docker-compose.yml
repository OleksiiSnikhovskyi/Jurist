services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: jur_db
      POSTGRES_USER: jur_user
      POSTGRES_PASSWORD: jur_password
    ports:
      - "5433:5432"
    volumes:
      - jur_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jur_user -d jur_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  jur_postgres_data:
