name: Jurist CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests-and-migrations:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: jur_db
          POSTGRES_USER: jur_user
          POSTGRES_PASSWORD: jur_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jur_user -d jur_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://jur_user:jur_password@localhost:5432/jur_db
      TEST_DATABASE_URL: sqlite+pysqlite:///:memory:
      EMBEDDING_PROVIDER: deterministic
      PYTHONUTF8: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Lint changed safety surface
        run: |
          ruff check app tests scripts migrations --select F --ignore F401

      - name: Apply migrations
        run: |
          alembic upgrade head

      - name: Check migration drift
        run: |
          alembic check

      - name: Run tests
        run: |
          pytest -q -p no:cacheprovider
